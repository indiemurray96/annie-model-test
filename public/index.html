<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Annie — Independent Analyst</title>
		<style>
			:root {
				--primary-color: #f6821f;
				--primary-hover: #e67e22;
				--light-bg: #f9fafb;
				--border-color: #e5e7eb;
				--text-color: #1f2937;
				--text-light: #6b7280;
				--user-msg-bg: #fff2e6;
				--assistant-msg-bg: #f3f4f6;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				line-height: 1.6;
				color: var(--text-color);
				max-width: 800px;
				margin: 0 auto;
				padding: 1rem;
			}

			header {
				text-align: center;
				margin-bottom: 2rem;
				padding: 1rem 0;
				border-bottom: 1px solid var(--border-color);
			}

			h1 {
				font-size: 1.5rem;
				color: var(--primary-color);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 200px);
				min-height: 400px;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				overflow: hidden;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background-color: var(--light-bg);
			}

			.message {
				margin-bottom: 1rem;
				padding: 0.75rem;
				border-radius: 8px;
				max-width: 80%;
				min-width: 0;
				overflow-wrap: anywhere;
			}

			.user-message .message-content { white-space: pre-wrap; }
			.assistant-message .message-content { line-height: 1.65; }
			.assistant-message .message-content > :first-child { margin-top: 0; }
			.assistant-message .message-content > :last-child { margin-bottom: 0; }
			.assistant-message p, .assistant-message ul, .assistant-message ol,
			.assistant-message blockquote, .assistant-message pre, .assistant-message .table-scroll {
				margin: 0 0 .8rem;
			}
			.assistant-message ul, .assistant-message ol { padding-left: 1.4rem; }
			.assistant-message li + li { margin-top: .25rem; }
			.assistant-message li > p { margin-bottom: .35rem; }
			.assistant-message h1, .assistant-message h2, .assistant-message h3,
			.assistant-message h4, .assistant-message h5, .assistant-message h6 {
				font-size: 1.05em; line-height: 1.4; color: inherit; margin: 1rem 0 .5rem;
			}
			.assistant-message a { color: #a64608; text-decoration-thickness: .08em; }
			.assistant-message blockquote { padding-left: .8rem; border-left: 3px solid #d1d5db; color: #4b5563; }
			.assistant-message code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88em; }
			.assistant-message :not(pre) > code { background: #e5e7eb; padding: .1rem .25rem; border-radius: 3px; }
			.assistant-message pre {
				max-width: 100%; overflow-x: auto; padding: .75rem; border-radius: 5px;
				background: #e5e7eb; white-space: pre; overflow-wrap: normal;
			}
			.table-scroll { max-width: 100%; overflow-x: auto; }
			.assistant-message table { border-collapse: collapse; min-width: 100%; font-size: .95em; overflow-wrap: normal; }
			.assistant-message th, .assistant-message td { padding: .45rem .6rem; border: 1px solid #d1d5db; text-align: left; vertical-align: top; }
			.assistant-message th { background: #e5e7eb; font-weight: 600; }
			.assistant-message hr { border: 0; border-top: 1px solid #d1d5db; margin: 1rem 0; }
			@media (max-width: 480px) {
				body { padding: .65rem; }
				header { margin-bottom: 1rem; padding: .75rem 0; }
				.chat-messages { padding: .65rem; }
				.message { max-width: 96%; padding: .7rem; }
				.chat-container { height: calc(100dvh - 180px); min-height: 360px; }
			}

			.user-message {
				background-color: var(--user-msg-bg);
				align-self: flex-end;
				margin-left: auto;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
			}

			.message-input {
				display: flex;
				padding: 0.75rem;
				border-top: 1px solid var(--border-color);
				background-color: white;
			}

			#user-input {
				flex: 1;
				min-width: 0;
				padding: 0.75rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-family: inherit;
				resize: none;
				min-height: 44px;
			}

			#send-button {
				margin-left: 0.5rem;
				padding: 0 1rem;
				background-color: var(--primary-color);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			#send-button:hover {
				background-color: var(--primary-hover);
			}

			#send-button:disabled {
				background-color: var(--text-light);
				cursor: not-allowed;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				color: var(--text-light);
				padding: 1rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			footer {
				margin-top: 1rem;
				text-align: center;
				font-size: 0.85rem;
				color: var(--text-light);
			}
		
:root { color-scheme: dark; --primary-color:#c5b3ff; --primary-hover:#dbceff; --light-bg:#17151e; --border-color:#36313f; --text-color:#eeeaf5; --text-light:#b3aabd; --user-msg-bg:#30273f; --assistant-msg-bg:transparent; }
body { background:#100f14; color:var(--text-color); max-width:1100px; height:100vh; height:100dvh; margin:auto; padding:24px 32px 16px; display:flex; flex-direction:column; overflow:hidden; }
header { display:flex; align-items:center; gap:16px; text-align:left; margin:0 0 22px; padding:0; border:0; flex-shrink:0; }
.monogram { width:48px; height:48px; display:grid; place-items:center; border:1px solid #64507f; border-radius:16px; color:#e4d6ff; background:#2c223a; font:28px Georgia,serif; }
h1 { font-size:25px; line-height:1.25; letter-spacing:-.7px; color:#f4effc; font-weight:650; }
.subtitle { color:var(--text-light); font-size:13px; margin-top:3px; }
.private-badge { margin-left:auto; border:1px solid var(--border-color); border-radius:30px; padding:5px 11px; color:#c4b7d5; font-size:12px; }
.conversation-bar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-shrink:0; }
.conversation-bar label { color:var(--text-light); font-size:12px; }
select, button, textarea { font:inherit; }
select { flex:1; min-width:0; width:0; text-overflow:ellipsis; padding:10px 32px 10px 12px; border:1px solid var(--border-color); border-radius:10px; background:#201c28; color:var(--text-color); font-size:13px; min-height:44px; }
button { min-height:44px; padding:9px 15px; border:1px solid #4b405b; border-radius:10px; background:#272130; color:#eee7f9; cursor:pointer; font-size:13px; font-weight:600; transition:background .15s; }
button:hover { background:#383044; }
#delete-chat { color:#c8afba; background:transparent; border-color:transparent; }
#delete-chat:hover:enabled { color:#ffd4de; background:#39232c; }
button:disabled { opacity:.45; cursor:not-allowed; }
:focus-visible { outline:2px solid #d7bdff; outline-offset:3px; }
.chat-container { flex:1; min-height:0; height:auto; border-radius:20px; background:var(--light-bg); box-shadow:0 16px 60px #0003; }
.chat-messages { min-height:0; padding:28px 32px; scrollbar-color:#564b64 transparent; }
.message { max-width:100%; padding:0; margin:0 0 28px; font-size:15px; }
.message::before { display:block; font-size:10px; font-weight:700; letter-spacing:1.5px; margin-bottom:9px; color:#ba9fe0; content:"ANNIE"; }
.user-message { max-width:85%; border:1px solid #4b3a60; border-radius:16px 16px 4px 16px; padding:15px 18px; }
.user-message::before { content:"YOU"; color:#c1b3d1; }
.assistant-message { padding-right:12px; }
.assistant-message .message-content { line-height:1.8; }
.assistant-message a { color:#d7baff; text-underline-offset:3px; }
.assistant-message blockquote { border-color:#9677bb; color:#c4b7d5; }
.assistant-message :not(pre)>code, .assistant-message pre { background:#292432; color:#e7dcf5; }
.assistant-message pre { padding:16px; border:1px solid var(--border-color); border-radius:10px; }
.table-scroll { border:1px solid #45394f; border-radius:10px; scrollbar-color:#6a577d #201b29; }
.assistant-message th,.assistant-message td { border-color:#45394f; padding:12px; min-width:110px; overflow-wrap:normal; }
.assistant-message th { background:#30263d; color:#e8dcf5; }
.assistant-message td { background:#211c2a; }
.assistant-message hr { border-color:var(--border-color); }
.message-input { align-items:flex-end; gap:12px; margin:0 20px 16px; padding:12px; border:1px solid #51415f; border-radius:15px; background:#221c2b; }
.message-input:focus-within { border-color:#ad8fd0; box-shadow:0 0 0 3px #b690e010; }
#user-input { background:transparent; color:var(--text-color); border:0; padding:9px 6px; font-size:16px; line-height:1.5; min-height:44px; max-height:160px; overflow-y:auto; }
#user-input::placeholder { color:#aea0bc; }
#user-input:focus-visible { outline:none; }
#send-button { background:#c5b3ff; color:#20152f; padding:0 18px; border-radius:10px; margin:0; min-height:44px; }
#send-button:hover:enabled { background:#dbceff; }
#send-button:disabled { background:#70647f; }
.typing-indicator { padding:0 32px 16px; color:#ccb7e6; font-size:13px; font-style:normal; }
footer { flex-shrink:0; margin-top:12px; font-size:11px; line-height:1.5; color:#a89bb6; }
.composer-hint { color:#bbaeC6; font-size:11px; padding:0 32px 12px; }
@media(max-width:600px) {
 body { padding:16px 12px 10px; } header { margin-bottom:16px; gap:11px; } h1 { font-size:23px; } .monogram { width:42px; height:42px; border-radius:13px; } .private-badge { font-size:10px; padding:4px 8px; }
 .conversation-bar { flex-wrap:wrap; gap:6px; margin-bottom:12px; } .conversation-bar label { width:100%; } select { font-size:12px; } button { padding:8px 10px; }
 .chat-container { min-height:0; height:auto; border-radius:16px; } .chat-messages { padding:20px 16px; } .message { max-width:100%; padding:0; font-size:14px; } .user-message { max-width:94%; padding:12px 14px; } .assistant-message { padding-right:0; }
 .message-input { margin:0 10px 10px; padding:7px; gap:6px; } #send-button { padding:0 13px; } .composer-hint { padding:0 20px 10px; } footer { font-size:10px; margin-top:8px; } .typing-indicator { padding:0 16px 12px; }
}
@media(max-height:500px) { body {overflow:auto; height:auto; min-height:100dvh;} .chat-container {flex:none; height:65dvh; min-height:260px;} }
@media(prefers-reduced-motion:reduce) { * {transition:none!important;scroll-behavior:auto!important;} }

</style>
	</head>
	<body>
		<header><div class="monogram" aria-hidden="true">a</div><div><h1>Annie</h1><p class="subtitle">Your independent analyst</p></div><span class="private-badge">Private conversations</span></header>

		<nav class="conversation-bar" aria-label="Conversations"><label for="conversation-select">Your conversations</label><select id="conversation-select"><option value="">New conversation</option></select><button id="new-chat" type="button">+ New</button><button id="delete-chat" type="button" disabled>Delete</button></nav>

		<main class="chat-container" aria-label="Chat with Annie">
			<div id="chat-messages" class="chat-messages" role="region" aria-label="Conversation messages" tabindex="0">
				
			</div>

			<div class="typing-indicator" id="typing-indicator" role="status">
				Annie is thinking…
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					aria-label="Message Annie"
                    placeholder="What’s on your mind?"
					rows="1"
					autofocus
				></textarea>
				<button id="send-button">Send</button>
			</div>
<p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
		</main>

		<footer>
			<p>Conversations saved privately · Saved notes are not verified conclusions.</p>
		</footer>

		<!-- Chat app script -->
		<script src="vendor/markdown-it.min.js"></script>
		<script src="markdown-renderer.js"></script>
		<script src="chat.js"></script>
	</body>
</html>
