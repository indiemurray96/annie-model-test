<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Annie — Independent Analyst</title>
		<style>
			:root {
				--primary-color: #f6821f;
				--primary-hover: #e67e22;
				--light-bg: #f9fafb;
				--border-color: #e5e7eb;
				--text-color: #1f2937;
				--text-light: #6b7280;
				--user-msg-bg: #fff2e6;
				--assistant-msg-bg: #f3f4f6;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				line-height: 1.6;
				color: var(--text-color);
				max-width: 800px;
				margin: 0 auto;
				padding: 1rem;
			}

			header {
				text-align: center;
				margin-bottom: 2rem;
				padding: 1rem 0;
				border-bottom: 1px solid var(--border-color);
			}

			h1 {
				font-size: 1.5rem;
				color: var(--primary-color);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				height: calc(100vh - 200px);
				min-height: 400px;
				border: 1px solid var(--border-color);
				border-radius: 8px;
				overflow: hidden;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1rem;
				background-color: var(--light-bg);
			}

			.message {
				margin-bottom: 1rem;
				padding: 0.75rem;
				border-radius: 8px;
				max-width: 80%;
				min-width: 0;
				overflow-wrap: anywhere;
			}

			.user-message .message-content { white-space: pre-wrap; }
			.assistant-message .message-content { line-height: 1.65; }
			.assistant-message .message-content > :first-child { margin-top: 0; }
			.assistant-message .message-content > :last-child { margin-bottom: 0; }
			.assistant-message p, .assistant-message ul, .assistant-message ol,
			.assistant-message blockquote, .assistant-message pre, .assistant-message .table-scroll {
				margin: 0 0 .8rem;
			}
			.assistant-message ul, .assistant-message ol { padding-left: 1.4rem; }
			.assistant-message li + li { margin-top: .25rem; }
			.assistant-message li > p { margin-bottom: .35rem; }
			.assistant-message h1, .assistant-message h2, .assistant-message h3,
			.assistant-message h4, .assistant-message h5, .assistant-message h6 {
				font-size: 1.05em; line-height: 1.4; color: inherit; margin: 1rem 0 .5rem;
			}
			.assistant-message a { color: #a64608; text-decoration-thickness: .08em; }
			.assistant-message blockquote { padding-left: .8rem; border-left: 3px solid #d1d5db; color: #4b5563; }
			.assistant-message code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .88em; }
			.assistant-message :not(pre) > code { background: #e5e7eb; padding: .1rem .25rem; border-radius: 3px; }
			.assistant-message pre {
				max-width: 100%; overflow-x: auto; padding: .75rem; border-radius: 5px;
				background: #e5e7eb; white-space: pre; overflow-wrap: normal;
			}
			.table-scroll { max-width: 100%; overflow-x: auto; }
			.assistant-message table { border-collapse: collapse; min-width: 100%; font-size: .95em; }
			.assistant-message th, .assistant-message td { padding: .45rem .6rem; border: 1px solid #d1d5db; text-align: left; vertical-align: top; }
			.assistant-message th { background: #e5e7eb; font-weight: 600; }
			.assistant-message hr { border: 0; border-top: 1px solid #d1d5db; margin: 1rem 0; }
			@media (max-width: 480px) {
				body { padding: .65rem; }
				header { margin-bottom: 1rem; padding: .75rem 0; }
				.chat-messages { padding: .65rem; }
				.message { max-width: 96%; padding: .7rem; }
				.chat-container { height: calc(100dvh - 180px); min-height: 360px; }
			}

			.user-message {
				background-color: var(--user-msg-bg);
				align-self: flex-end;
				margin-left: auto;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
			}

			.message-input {
				display: flex;
				padding: 0.75rem;
				border-top: 1px solid var(--border-color);
				background-color: white;
			}

			#user-input {
				flex: 1;
				min-width: 0;
				padding: 0.75rem;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-family: inherit;
				resize: none;
				min-height: 44px;
			}

			#send-button {
				margin-left: 0.5rem;
				padding: 0 1rem;
				background-color: var(--primary-color);
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			#send-button:hover {
				background-color: var(--primary-hover);
			}

			#send-button:disabled {
				background-color: var(--text-light);
				cursor: not-allowed;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				color: var(--text-light);
				padding: 1rem;
			}

			.typing-indicator.visible {
				display: block;
			}

			footer {
				margin-top: 1rem;
				text-align: center;
				font-size: 0.85rem;
				color: var(--text-light);
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Annie — Independent Analyst</h1>
			<p>GPT-OSS 120B · private saved conversations</p>
		</header>

		<div style="display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem"><label for="conversation-select">Conversation</label><select id="conversation-select" style="flex:1;min-width:130px;padding:.45rem"><option value="">New conversation</option></select><button id="new-chat" type="button">New</button><button id="delete-chat" type="button" disabled>Delete</button></div>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Type your message here..."
					rows="1"
					autofocus
				></textarea>
				<button id="send-button">Send</button>
			</div>
		</div>

		<footer>
			<p>Private D1 continuity. Chat excerpts are automatically saved as unreviewed notes, not verified conclusions.</p>
		</footer>

		<!-- Chat app script -->
		<script src="vendor/markdown-it.min.js"></script>
		<script src="markdown-renderer.js"></script>
		<script src="chat.js"></script>
	</body>
</html>
